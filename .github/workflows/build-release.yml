name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build OpenSteamToolGUI.csproj -c Release -v:q
      - name: Core checks
        run: dotnet run --project tests/CoreChecks/CoreChecks.csproj -c Release
      - name: UI checks
        run: dotnet run --project tests/UiChecks/UiChecks.csproj -c Release
      - name: Publish archives
        shell: pwsh
        run: ./build.ps1 -SkipSdkInstall
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenSteamToolGUI-win-x64
          path: dist/*.zip
      - name: Create GitHub release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (& dotnet msbuild OpenSteamToolGUI.csproj -getProperty:Version).Trim()
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid application version: $version" }
          $tag = "v$version"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne $tag) {
            throw "Pushed tag $env:GITHUB_REF_NAME does not match application version $tag."
          }
          $existingTag = git tag --list $tag
          if ($LASTEXITCODE -ne 0) { throw "Could not inspect tag $tag." }
          if ($existingTag) {
            $tagCommit = (git rev-list -n 1 $tag).Trim()
            if ($LASTEXITCODE -ne 0 -or $tagCommit -ne $env:GITHUB_SHA) {
              throw "$tag already points to another commit. Increase the application version before pushing to main."
            }
          }
          gh release view $tag --json tagName --jq .tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists for this commit."
            exit 0
          }
          $assets = @('dist/OpenSteamToolGUI-portable-win-x64.zip', 'dist/OpenSteamToolGUI-lightweight-win-x64.zip')
          foreach ($asset in $assets) { if (-not (Test-Path -LiteralPath $asset)) { throw "Missing release asset: $asset" } }
          $tagOptions = if ($existingTag) { @('--verify-tag') } else { @('--target', $env:GITHUB_SHA) }
          gh release create $tag @assets --title $tag --latest --notes 'Each Windows x64 ZIP contains one OpenSteamToolGUI.exe. The lightweight build requires .NET 10 Desktop Runtime.' @tagOptions
          if ($LASTEXITCODE -ne 0) { throw "Could not publish release $tag." }
    permissions:
      contents: write
