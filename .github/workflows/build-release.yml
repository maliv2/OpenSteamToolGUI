name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build OpenSteamToolGUI.csproj -c Release -v:q
      - name: Core checks
        run: dotnet run --project tests/CoreChecks/CoreChecks.csproj -c Release
      - name: UI checks
        run: dotnet run --project tests/UiChecks/UiChecks.csproj -c Release
      - name: Publish archives
        shell: pwsh
        run: ./build.ps1 -SkipSdkInstall
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenSteamToolGUI-win-x64
          path: dist/*.zip
      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ github.ref_name }}' dist/OpenSteamToolGUI-portable-win-x64.zip dist/OpenSteamToolGUI-lightweight-win-x64.zip --title '${{ github.ref_name }}' --notes 'Each Windows x64 ZIP contains one OpenSteamToolGUI.exe. The lightweight build requires .NET 10 Desktop Runtime.' --verify-tag
    permissions:
      contents: write
